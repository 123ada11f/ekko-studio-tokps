name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 语法检查
        run: |
          node --check tokps-overlay.js
          node --check inject-cdp.mjs
          python -m py_compile studio_tokps.py dev/ndjson-test-server.py
      - name: 解析/计算自检
        run: node test/parser.test.mjs
